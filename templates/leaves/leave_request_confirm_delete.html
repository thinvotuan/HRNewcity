{% extends 'base.html' %}

{% block title %}Xóa đơn nghỉ phép{% endblock %}
{% block page_title %}Xóa đơn nghỉ phép{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0 rounded-3">
            <div class="card-body p-4 text-center">
                <div class="text-danger display-4 mb-3">
                    <i class="bi bi-exclamation-triangle-fill"></i>
                </div>
                <h5 class="fw-bold">Xác nhận xóa đơn nghỉ phép</h5>
                <p class="text-muted">
                    Bạn có chắc chắn muốn xóa đơn nghỉ phép của
                    <strong>{{ leave_request.employee.full_name }}</strong>?
                </p>
                <form method="post" class="d-flex gap-2 justify-content-center">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">
                        <i class="bi bi-trash me-2"></i>Xóa
                    </button>
                    <a href="{% url 'leave_request_list' %}" class="btn btn-outline-secondary">Hủy</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
